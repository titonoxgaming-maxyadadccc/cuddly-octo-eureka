name: Build TITOPLAY APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" > /dev/null

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-linux-android --target armv7-linux-androideabi
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/vendor/**', 'native/src/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: native-dsp/bungee
          key: bungee-${{ hashFiles('app/build.gradle.kts') }}

      - name: cargo-ndk
        run: command -v cargo-ndk > /dev/null || cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDev --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TITOPLAY-apk
          path: app/build/outputs/apk/dev/*.apk
          retention-days: 30
          if-no-files-found: error
